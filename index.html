<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Speed Test</title>
<meta name="description" content="Check your internet speed in seconds. Download, upload, latency and jitter. No sign-up, no ads, nothing stored.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#111418;--mute:#6B7480;--line:#E6E9ED;--accent:#0A6CFF;--soft:#F4F6F8;--done:#16A34A}
@media (prefers-color-scheme:dark){:root{--bg:#0E1114;--ink:#F2F4F6;--mute:#8B95A1;--line:#222831;--accent:#4C93FF;--soft:#161A1F;--done:#34D399}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column}
nav{padding:20px 28px;font-weight:800;font-size:18px;letter-spacing:-.01em}
nav span{color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 20px 56px}
.kicker{font-size:clamp(16px,2.4vw,22px);color:var(--mute);margin:0 0 6px}
.speed{display:flex;align-items:baseline;justify-content:center;gap:14px;line-height:1}
#num{font-size:clamp(120px,28vw,300px);font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--mute);transition:color .3s}
.done #num{color:var(--ink)}
#unit{font-size:clamp(22px,4vw,40px);color:var(--mute);font-weight:500}
#phase{height:26px;margin:14px 0 0;color:var(--mute);font-size:16px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.running .dot{animation:p 1s ease-in-out infinite}
.done .dot{background:var(--done)}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.running .dot{animation:none}}
.bar{width:min(420px,80vw);height:4px;background:var(--line);border-radius:4px;margin:18px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.actions{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;font-size:16px;border-radius:999px;padding:13px 26px;cursor:pointer;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#more{width:min(640px,100%);margin-top:34px;display:none}
#more.open{display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cell{background:var(--bg);padding:18px 10px}
.cell b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.cell b small{font-size:14px;font-weight:500;color:var(--mute);margin-left:3px}
.cell span{font-size:13px;color:var(--mute)}
.meta{margin-top:14px;font-size:14px;color:var(--mute);display:flex;gap:6px 22px;justify-content:center;flex-wrap:wrap}
#err{color:#D93025;margin-top:16px;font-size:15px;min-height:20px}
footer{padding:18px 28px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);display:flex;gap:8px 24px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav>Speed<span>Test</span></nav>
<main id="app">
  <p class="kicker">Your internet speed is</p>
  <div class="speed"><span id="num">0</span><span id="unit">Mbps</span></div>
  <div id="phase" aria-live="polite"><span class="dot"></span><span id="ptext">Starting</span></div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div id="err" role="alert"></div>
  <div class="actions">
    <button class="primary" id="again" disabled>Test again</button>
    <button id="toggle" aria-expanded="false" aria-controls="more">Show more info</button>
  </div>
  <section id="more" aria-label="Detailed results">
    <div class="grid">
      <div class="cell"><b id="r-down">–<small>Mbps</small></b><span>Download</span></div>
      <div class="cell"><b id="r-up">–<small>Mbps</small></b><span>Upload</span></div>
      <div class="cell"><b id="r-ping">–<small>ms</small></b><span>Latency</span></div>
      <div class="cell"><b id="r-jit">–<small>ms</small></b><span>Jitter</span></div>
    </div>
    <div class="meta"><span id="m-isp"></span><span id="m-srv"></span></div>
  </section>
</main>
<footer>
  <span>Nothing is stored or sent to us. Tests run directly between your browser and the test server.</span>
  <span>Results vary with Wi‑Fi, device load and server distance.</span>
</footer>

<script>
const $=id=>document.getElementById(id);
const BASE="https://speed.cloudflare.com";
const app=$("app");
let busy=false;
const fmt=n=>n>=100?String(Math.round(n)):n>=10?n.toFixed(0):n.toFixed(1);
const setBig=v=>$("num").textContent=fmt(v);
const setPhase=(t,p)=>{$("ptext").textContent=t;$("prog").style.width=p+"%"};
const cell=(id,v,u)=>$(id).innerHTML=v+"<small>"+u+"</small>";

// Ping + jitter
async function latency(n=12){
  const t=[];
  for(let i=0;i<n;i++){
    const s=performance.now();
    try{await fetch(`${BASE}/__down?bytes=0&r=${Math.random()}`,{cache:"no-store"});t.push(performance.now()-s)}catch(e){}
  }
  if(!t.length)throw new Error("Can't reach the test server");
  const sorted=[...t].sort((a,b)=>a-b);
  const jit=t.slice(1).reduce((a,x,i)=>a+Math.abs(x-t[i]),0)/Math.max(1,t.length-1);
  return{ping:sorted[Math.floor(sorted.length/2)],jitter:jit};
}

// Download: parallel streams, ignore first second of ramp-up
async function download(ms=8000,streams=4){
  const ctl=new AbortController(),t0=performance.now();
  let bytes=0,mark=null,markBytes=0,last=0;
  const stop=setTimeout(()=>ctl.abort(),ms);
  const worker=async()=>{
    while(!ctl.signal.aborted){
      const r=await fetch(`${BASE}/__down?bytes=25000000&r=${Math.random()}`,{cache:"no-store",signal:ctl.signal});
      const rd=r.body.getReader();
      for(;;){
        const{done,value}=await rd.read();if(done)break;
        bytes+=value.length;
        const el=performance.now()-t0;
        if(mark===null&&el>1000){mark=el;markBytes=bytes}
        if(mark!==null&&el-last>150){
          last=el;setBig((bytes-markBytes)*8/1e6/((el-mark)/1000));
          setPhase("Testing download",10+Math.min(50,el/ms*50));
        }
      }
    }
  };
  try{await Promise.all(Array.from({length:streams},worker))}catch(e){if(e.name!=="AbortError")throw e}
  clearTimeout(stop);
  const el=performance.now()-t0;
  if(mark===null)return bytes*8/1e6/(el/1000);
  return (bytes-markBytes)*8/1e6/((el-mark)/1000);
}

// Upload: parallel posts of 2 MB chunks for a fixed window
async function upload(ms=6000,streams=3){
  const chunk=new Blob([new Uint8Array(2e6)]);
  const t0=performance.now();let bytes=0;
  const worker=async()=>{
    while(performance.now()-t0<ms){
      await fetch(`${BASE}/__up`,{method:"POST",body:chunk,cache:"no-store"});
      bytes+=2e6;
      const el=performance.now()-t0;
      setBig(bytes*8/1e6/(el/1000));
      setPhase("Testing upload",62+Math.min(33,el/ms*33));
    }
  };
  await Promise.all(Array.from({length:streams},worker));
  return bytes*8/1e6/((performance.now()-t0)/1000);
}

async function meta(){
  try{
    const m=await (await fetch(`${BASE}/meta`,{cache:"no-store"})).json();
    $("m-isp").textContent=m.asOrganization?"Network: "+m.asOrganization:"";
    const c=m.colo&&typeof m.colo==="object"?(m.colo.city||m.colo.iata):m.colo;
    $("m-srv").textContent=c?"Server: "+c+(m.country?", "+m.country:""):"";
  }catch(e){}
}

async function run(){
  if(busy)return;busy=true;
  app.className="running";$("again").disabled=true;$("err").textContent="";
  setBig(0);setPhase("Checking latency",3);
  try{
    meta();
    const l=await latency();cell("r-ping",Math.round(l.ping),"ms");cell("r-jit",l.jitter.toFixed(1),"ms");
    const d=await download();cell("r-down",fmt(d),"Mbps");setBig(d);
    const u=await upload();cell("r-up",fmt(u),"Mbps");
    setBig(d);setPhase("Done",100);app.className="done";
  }catch(e){
    app.className="";$("err").textContent="The test couldn't finish: "+e.message+". Check your connection and try again.";
    setPhase("Stopped",0);
  }
  busy=false;$("again").disabled=false;
}

$("again").onclick=run;
$("toggle").onclick=()=>{
  const o=$("more").classList.toggle("open");
  $("toggle").setAttribute("aria-expanded",o);
  $("toggle").textContent=o?"Hide more info":"Show more info";
};
run();
</script>
</body>
</html>
